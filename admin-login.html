<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Admin Login | RentKaro</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<main class="auth-page">
    <div class="auth-card">
        <div class="auth-brand">RentKaro Admin</div>
        <h1>Admin Sign In</h1>
        <p>Access the vehicle rental management panel.</p>
        <form id="adminLoginForm">
            <div class="form-group">
                <label>Email</label>
                <input id="adminEmail" type="email" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input id="adminPassword" type="password" required>
            </div>
            <button class="full-btn" type="submit">Sign In</button>
        </form>
        <div class="auth-footer">
            <a href="index.html">← Back to website</a>
        </div>
    </div>
</main>
<script>
document.getElementById("adminLoginForm").addEventListener("submit", async function(e) {
    e.preventDefault();

    const email = document.getElementById("adminEmail").value.trim();
    const password = document.getElementById("adminPassword").value;

    if (!email || !password) {
        alert("Please fill in all fields.");
        return;
    }

    try {
        const response = await fetch("./admin/login.php", {
            method: "POST",
            headers: { "Content-Type": "application/x-www-form-urlencoded" },
            body: new URLSearchParams({ email: email, password: password })
        });

        const result = await response.json();

        if (result.success) {
            alert(result.message);
            window.location.href = "admin-dashboard.html";
        } else {
            alert(result.message);
        }
    } catch (error) {
        console.error(error);
        alert("Unable to connect to the server.");
    }
});
</script>
</body>
</html>
